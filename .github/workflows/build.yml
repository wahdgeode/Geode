name: Build GDPS EDITOR 2.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Android mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64

      - name: Upload GEODE file
        uses: actions/upload-artifact@v4
        with:
          name: GDPS-EDITOR-2.3-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
